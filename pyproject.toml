[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ragbench"
version = "0.1.0"
description = "A modular RAG evaluation workbench: ingestion, retrieval, grounded generation and metrics."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["rag", "retrieval", "evaluation", "embeddings", "citations"]
dependencies = [
    "pymupdf>=1.24",
    "pydantic>=2.7",
    "tiktoken>=0.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
index = ["chromadb>=1.0"]
analysis = ["pandas>=2.2", "matplotlib>=3.8"]
notebook = ["jupyterlab>=4.2", "ipykernel>=6.29"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ragbench = "ragbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ragbench"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "network: tests that call a real hosted API (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
